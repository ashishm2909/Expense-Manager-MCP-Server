[project]
name = "mcp-remote-server"
version = "0.1.0"
description = "Expense Manager MCP Server built with FastMCP"
readme = "README.md"
authors = [
    { name = "Ashish Mishra", email = "i.m.ashishhh@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.2.3",
    "aiosqlite>=0.20.0",
]

[project.scripts]
mcp-remote-server = "mcp_remote_server:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
